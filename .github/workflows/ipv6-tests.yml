name: v0.34 release regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ipv6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y fail2ban nftables shellcheck
      - name: Shell syntax
        run: find releases/v0.34 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck errors
        run: find releases/v0.34 -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
      - name: Python syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/f2b-pycache
        run: /usr/bin/python3 -m compileall -q releases/v0.34/scripts releases/v0.34/tests
      - name: Static release safety
        run: /usr/bin/python3 releases/v0.34/tests/test_release_static.py
      - name: Wrapper regression tests
        run: /usr/bin/python3 releases/v0.34/tests/test_wrapper.py
      - name: Reporting scope tests
        run: /usr/bin/python3 releases/v0.34/tests/test_report_filter.py
      - name: Upgrade transaction unit tests
        run: /usr/bin/python3 releases/v0.34/tests/test_upgrade.py
      - name: Canary 227c393 transaction scope tests
        run: /usr/bin/python3 releases/v0.34/tests/test_canary_upgrade_227c393.py
      - name: Optional Easy!Appointments Apache hardening tests
        run: /usr/bin/python3 releases/v0.34/tests/test_easyappointments_hardening.py
      - name: Critical RCE access and error log fixtures
        run: /usr/bin/python3 releases/v0.34/tests/test_exploit_critical.py
      - name: WordPress-safe webshell sweep fixtures
        run: /usr/bin/python3 releases/v0.34/tests/test_webshell_sweep.py
      - name: Full Fail2Ban candidate configuration test
        run: |
          candidate="$(mktemp -d)"
          cp -a /etc/fail2ban/. "$candidate/"
          cp releases/v0.34/filters/*.conf "$candidate/filter.d/"
          cp releases/v0.34/actions/*.conf releases/v0.34/actions/*.local "$candidate/action.d/"
          cp releases/v0.34/config/nginx-recon-optimized.local "$candidate/filter.d/"
          cp releases/v0.34/config/f2b-anomaly-detection.local "$candidate/filter.d/"
          cp releases/v0.34/config/jail.local "$candidate/jail.local"
          sudo mkdir -p /opt/rustnpm/data/logs
          sudo touch \
            /opt/rustnpm/data/logs/fallback_access.log \
            /opt/rustnpm/data/logs/fallback_http_access.log \
            /opt/rustnpm/data/logs/dead-host_access.log \
            /opt/rustnpm/data/logs/proxy-host-1_access.log \
            /opt/rustnpm/data/logs/fallback_error.log \
            /opt/rustnpm/data/logs/proxy-host-1_error.log \
            /var/log/auth.log \
            /var/log/fail2ban.log \
            /var/log/fail2ban-blocked-ips.txt
          sudo /usr/bin/fail2ban-client -c "$candidate" -t
      - name: PHP filter and binary-log mail tests
        run: /usr/bin/python3 releases/v0.34/tests/test_php_errors.py
      - name: IPv6 parser tests
        run: /usr/bin/python3 releases/v0.34/tests/test_ipv6_sync.py
      - name: Real nftables in disposable network namespace
        run: sudo unshare --net /usr/bin/python3 releases/v0.34/tests/test_ipv6_sync.py --net
