# Fail2Ban Hybrid Manager v0.34-dev
# Rate-based detection of missing executable-file sweeps in NPM access logs.

[Definition]
# NPM fields: final status, upstream status, method, scheme, host, target,
# client. Only the final 404 access record counts; redirects and error logs do
# not match and therefore cannot double-count the same request.
failregex = ^\[[^\]\r\n]*\] (?:(?:-|[A-Z_]+) (?:[1-5][0-9]{2}|-) )?404 - (?:GET|HEAD) (?:http|https) [^ ]+ "/(?:[^\"?]*/)*[^/\"?]+\.(?:php[0-9]*|phtml|phar)(?:\?[^\"]*)?" \[Client <HOST>\]

# Core WordPress entry points stay excluded even if a broken deployment returns
# 404, including installations in arbitrarily nested subdirectories. Existing
# plugin endpoints are naturally excluded by the required final 404.
ignoreregex = ^.* (?:GET|HEAD) (?:http|https) [^ ]+ "/(?:[^/\"?\s]+/)*(?:index\.php|wp-login\.php|wp-admin/admin-ajax\.php|wp-cron\.php)(?:\?[^\"\s]*)?" \[Client <HOST>\]
