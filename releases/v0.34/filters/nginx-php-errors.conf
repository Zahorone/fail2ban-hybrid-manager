# Fail2Ban Hybrid Manager v0.34-dev
# Filter: nginx-php-errors.conf
# Date: 2026-10-08
# Managed by: INSTALL-ALL-v034 bundle
# Detects explicit exploit indicators emitted in PHP/nginx error logs.
# It intentionally does not ban ordinary PHP fatals, warnings or HTTP 5xx.

[Definition]

# Nginx may put "client:" before or after the FastCGI/PHP text. Keep both
# layouts explicit so matching never falls back to banning generic PHP errors.
failregex = ^.*client: <HOST>.*PHP message: .*(?:auto_prepend_file|allow_url_include|shell_exec|exec\(|system\(|passthru\(|proc_open|eval\(base64_decode|base64_decode\(.*\$_(?:GET|POST|REQUEST)|SQL syntax.*(?:UNION SELECT|OR 1=1)).*$
            ^.*PHP message: .*(?:auto_prepend_file|allow_url_include|shell_exec|exec\(|system\(|passthru\(|proc_open|eval\(base64_decode|base64_decode\(.*\$_(?:GET|POST|REQUEST)|SQL syntax.*(?:UNION SELECT|OR 1=1)).*client: <HOST>.*$
            ^.*client: <HOST>.*request: ".*(?:%%AD|%%ad|-d\s+).*".*$
            ^.*request: ".*(?:%%AD|%%ad|-d\s+).*".*client: <HOST>.*$
            ^.*client: <HOST>.*"/vendor/.*(?:\.php|\.phar|shell).*" failed.*$
            ^.*"/vendor/.*(?:\.php|\.phar|shell).*" failed.*client: <HOST>.*$
            ^.*client: <HOST>.*PHP Fatal error.*vendor/.*backdoor.*$
            ^.*PHP Fatal error.*vendor/.*backdoor.*client: <HOST>.*$
            ^.*client: <HOST>.*PHP Warning:.*failed to open stream.*\.\./\.\./.*$
            ^.*PHP Warning:.*failed to open stream.*\.\./\.\./.*client: <HOST>.*$
            ^.*client: <HOST>.*PHP Warning: include.*:/.*$
            ^.*PHP Warning: include.*:/.*client: <HOST>.*$

ignoreregex =

[Init]
maxlines = 5
