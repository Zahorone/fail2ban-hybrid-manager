[INCLUDES]
after = nftables-common.local

# Both sets and their input/forward rules are managed by the scoped firewall.
[Definition]
actionstart = nft list set inet <table> <recidive_set>
actioncheck = nft list set inet <table> <recidive_set>
actionban = nft add element inet <table> <recidive_set> { <ip> timeout <bantime>s }
actionunban = nft delete element inet <table> <recidive_set> { <ip> }
actionflush = nft flush set inet <table> <recidive_set>
actionstop =
[Init]
table = fail2ban-filter
recidive_set = f2b-recidive
[Init?family=inet6]
recidive_set = f2b-recidive-v6
