# Optional Easy!Appointments hardening. Installed only by the explicit
# easyappointments-apache-hardening.py workflow.
<Directory "/var/www/html/easyappointments/storage/backups">
    AllowOverride None
    Options -Indexes -ExecCGI
    Require all denied
</Directory>

<Directory "/var/www/html/easyappointments/storage/logs">
    AllowOverride None
    Options -Indexes -ExecCGI
    Require all denied
</Directory>

<Directory "/var/www/html/easyappointments/storage/sessions">
    AllowOverride None
    Options -Indexes -ExecCGI
    Require all denied
</Directory>

<Directory "/var/www/html/easyappointments/storage/cache">
    AllowOverride None
    Options -Indexes -ExecCGI
    Require all denied
</Directory>

<Directory "/var/www/html/easyappointments/storage/uploads">
    AllowOverride None
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(?:php[0-9]*|phtml|phar|cgi|pl|py|sh)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
